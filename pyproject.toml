[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pm-analyzer"
version = "0.1.0"
description = "Maintenance and fleet data analysis for SAP and GPS exports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PM Analyzer Team" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
pm-analyzer = "pm_analyzer.cli:main"
pm-analyzer-gui = "pm_analyzer.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_analyzer"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
